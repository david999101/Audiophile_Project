<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Category - Audiophile</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container navbar-container">
        <div
          class="logo"
          style="cursor: pointer"
          onclick="window.location.href = '/'"
        >
          audiophile
        </div>
        <ul class="nav-links">
          <li><a href="/">HOME</a></li>
          <li><a href="/category.html?type=headphones">HEADPHONES</a></li>
          <li><a href="/category.html?type=speakers">SPEAKERS</a></li>
          <li><a href="/category.html?type=earphones">EARPHONES</a></li>
        </ul>
        <div class="cart-icon" id="cart-icon-btn">
          🛒 <span id="cart-count">0</span>
        </div>
      </div>
    </nav>

    <header class="category-header">
      <h1 id="category-title">CATEGORY</h1>
    </header>

    <main
      class="container category-products-container"
      id="products-list"
    ></main>

    <div id="cart-modal" class="cart-modal-overlay">
      <div
        class="cart-modal-card"
        style="
          position: absolute;
          top: 100px;
          right: 10%;
          background: white;
          padding: 30px;
          border-radius: 8px;
          width: 380px;
          z-index: 1000;
        "
      >
        <div
          class="cart-modal-header"
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
          "
        >
          <h5
            style="
              margin: 0;
              font-size: 18px;
              font-weight: 700;
              letter-spacing: 1.3px;
            "
          >
            CART (<span id="modal-cart-count">0</span>)
          </h5>
          <button
            id="clear-all-btn"
            class="clear-btn"
            style="
              background: none;
              border: none;
              opacity: 0.5;
              text-decoration: underline;
              cursor: pointer;
            "
          >
            Remove all
          </button>
        </div>

        <div id="cart-items-container"></div>

        <div
          class="cart-total-block"
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
          "
        >
          <span
            class="total-label"
            style="opacity: 0.5; font-size: 15px; font-weight: 500"
            >TOTAL</span
          >
          <span
            id="cart-total-price"
            class="total-price"
            style="font-size: 18px; font-weight: 700"
            >$ 0</span
          >
        </div>

        <button
          class="btn btn-primary"
          style="width: 100%; margin-top: 24px"
          onclick="window.location.href = '/checkout'"
        >
          CHECKOUT
        </button>
      </div>
    </div>

    <footer class="footer">
      <div class="container footer-container">
        <div class="footer-top">
          <div class="logo">audiophile</div>
          <ul class="footer-links">
            <li><a href="/">HOME</a></li>
            <li><a href="/category.html?type=headphones">HEADPHONES</a></li>
            <li><a href="/category.html?type=speakers">SPEAKERS</a></li>
            <li><a href="/category.html?type=earphones">EARPHONES</a></li>
          </ul>
        </div>
        <div class="footer-bottom">
          <p class="footer-desc">
            Audiophile is an all-in-one platform to fulfill your audio needs...
          </p>
          <div class="footer-meta">
            <p class="copyright">Copyright 2026. All Rights Reserved</p>
          </div>
        </div>
      </div>
    </footer>

    <script src="category.js"></script>
  </body>
</html>
